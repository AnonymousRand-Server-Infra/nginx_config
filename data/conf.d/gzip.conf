# MAKE SURE TO EXCLUDE RESPONSES WHOSE BODIES CONTAIN SECRETS FROM COMPRESSION!! (see BREACH attack)
# (in the upstream, set the `Cache-Control: no-transform` header to exclude it from compression)

gzip on;

# 6 is usually a good sweet spot
gzip_comp_level 6;

# don't compress files smaller than 256 bytes as it can be counterproductive
gzip_min_length 256;

# allow gzip even through a proxy like cloudflare
gzip_proxied any;

# instructs proxies and browsers to cache compressed and uncompressed versions separately,
# so clients who cannot decompress gzip will not be served compressed garbage
gzip_vary on;

# specify mime types to compress (default is only `text/html`)
# don't compress media files, woff/woff2 fonts, pdfs, zips as they are already highly compressed
gzip_types
    application/json
    application/javascript
    application/manifest+json
    application/xml
    application/xml+rss
    application/xhtml+xml
    font/opentype
    font/ttf
    font/otf
    image/svg+xml
    text/css
    text/html
    text/javascript
    text/plain
    text/xml;
