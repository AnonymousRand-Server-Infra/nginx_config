# add headers (if not already provided by upstream server) for security
# (`default ""` ensures that if the header already exists from the upstream,
# we assign an empty string which makes nginx skip adding it)
map $upstream_http_strict_transport_security $add_strict_transport_security {
    "" "max-age=15768000; includeSubDomains";
    default "";
}
map $upstream_http_x_content_type_options $add_x_content_type_options {
    "" "nosniff";
    default "";
}
map $upstream_http_x_frame_options $add_x_frame_options {
    "" "SAMEORIGIN";
    default "";
}

# (the `always` makes this header be added regardless of the response code)
add_header Strict-Transport-Security $add_strict_transport_security always;
add_header X-Content-Type-Options $add_x_content_type_options always;
add_header X-Frame-Options $add_x_frame_options always;
