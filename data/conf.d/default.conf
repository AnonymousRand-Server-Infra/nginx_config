# `default_server` makes this server block the default server if an incoming request's
# `Host` field does not match any server_name, and this server block will return a
# 404 not found if that's the case
# NOTE: putting this in `default.conf` is needed to overwrite the default `default.conf`
# generated by nginx's docker image, which sets up its own catch-all!
server {
    listen 80 default_server;
    listen 443 default_server ssl;

    ssl_certificate /etc/nginx/ssl/self_cert.pem;
    ssl_certificate_key /etc/nginx/ssl/self_key.pem;

    return 404;
}
