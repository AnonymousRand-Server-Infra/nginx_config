include:
  - ${PATH_TO_SERVER_ROOT:?}/${PATH_FROM_ROOT_TO_UTILS:?}/shared_sckts.yaml

services:
  nginx:
    container_name: nginx
    extends:
      file: ${PATH_TO_SERVER_ROOT:?}/${PATH_FROM_ROOT_TO_UTILS:?}/shared_sckts.yaml
      service: shared_sckts_user
    profiles:
      - ${DOCKER_DEFAULT_PROFILE:?}
    build:
      context: ${PATH_TO_SERVER_ROOT:?}
      # needed or else it doesn't work from other directories?
      dockerfile: ${PATH_FROM_ROOT_TO_NGINX:?}/Dockerfile
      args:
        NGINX_CONFIG_SRC_FILES: ${NGINX_CONFIG_SRC_FILES:?}
    restart: unless-stopped
    user: ${DOCKER_ROOT_USER:?}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # letsencrypt ssl certs
      # SYNC: paths inside container required by nginx config
      - type: bind
        source: /etc/letsencrypt/
        target: /etc/letsencrypt/
        read_only: true
      # ssl certs for self-signed certs (e.g. https catch-all block)
      # SYNC: paths inside container required by nginx config
      - type: bind
        source: /etc/nginx/ssl/
        target: /etc/nginx/ssl/
        read_only: true
      # acme challenge path for e.g. certbot autorenewals from the host/another container
      # SYNC: path inside container required by nginx config
      - type: bind
        source: /var/www/certbot/
        target: ${NGINX_ACME_CHALLS_PATH:?}
        read_only: true
        bind:
          create_host_path: true
      # logs
      # SYNC: log paths of each service/nginx site inside container
      - type: bind
        source: /var/log/nginx/
        target: /var/log/nginx/
        bind:
          create_host_path: true
    env_file:
      # for `envsubst`
      # i don't think there's a way to store a dynamic list in an env var, hence this bullshit
      # make sure this accommodates all the files you need, and keep an `.empty.env` as a fallback
      - ${ENVSUBST_ENV_FILE_1:-.empty.env}
      - ${ENVSUBST_ENV_FILE_2:-.empty.env}
      - ${ENVSUBST_ENV_FILE_3:-.empty.env}
      - ${ENVSUBST_ENV_FILE_4:-.empty.env}
      - ${ENVSUBST_ENV_FILE_5:-.empty.env}
      - ${ENVSUBST_ENV_FILE_6:-.empty.env}
      - ${ENVSUBST_ENV_FILE_7:-.empty.env}
      - ${ENVSUBST_ENV_FILE_8:-.empty.env}
    healthcheck:
      # we use `nc` instead of `curl` here since `curl` isn't in the `alpine-slim` nginx image
      # and `wget` is bad here since it returns nonzero on 404, but we're just testing connectivity
      # also `localhost` doesn't work since ipv6
      test: ["CMD", "nc", "-z", "127.0.0.1", "80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
